[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-harness"
version = "0.1.0"
description = "Circuit experiments, simulator sessions and independent evaluation with Harbor"
license = {file = "LICENSE"}
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Circuit Harness contributors"}]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
chips = ["gdstk==1.0.0"]
harbor = ["harbor==0.23.0"]
data = ["pyarrow>=15,<26"]
sft = ["torch>=2.1", "transformers>=4.51,<5", "pyarrow>=15,<26"]
dev = ["pytest>=7.0", "ruff==0.15.6", "pyarrow>=15,<26", "mcp>=1.27,<2"]

[project.scripts]
circuit-harness = "circuit_harness.cli:main"

[project.urls]
Homepage = "https://github.com/BucketSran/circuit-harness"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "Notice.txt"]

[tool.setuptools.package-data]
"circuit_harness.harbor" = ["*.schema.json"]
"circuit_harness.data" = ["json/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["circuit_harness*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
isort = {known-first-party = ["circuit_harness"]}
select = ["E", "F", "B", "I", "UP"]
