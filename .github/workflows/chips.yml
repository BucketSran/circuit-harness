name: Chips harness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y csh iverilog ngspice
      - run: python -m pip install -e '.[dev,mcp,chips,harbor]'
      - run: ruff check alphaapollo tests && ruff format --check alphaapollo tests
      - run: python -m pytest -q tests/chips tests/common/execution/test_chips_harness.py tests/common/execution/test_chips_ngspice.py tests/common/test_import_boundaries.py tests/workflows/test_chips.py tests/workflows/test_visualize.py tests/reasoning/runtime/test_external_bridge.py tests/workflows/resources/test_composition_contract.py --junitxml=runs/chips/validation/ci/junit.xml
      - run: python -m alphaapollo._schema_export
      - run: python -m compileall -q alphaapollo tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chips-local-tests
          path: runs/chips/validation/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
  trajectory-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git submodule update --init third_party/verl
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,harbor]' 'transformers==4.57.6' 'tensordict==0.10.0' ray pillow pandas codetiming
      - run: |
          python -c 'import torch, transformers, pyarrow, verl'
          python -m pytest -q tests/learning/off_policy/test_atif_dataset.py
        env:
          PYTHONPATH: third_party/verl
          HF_HUB_OFFLINE: '1'
