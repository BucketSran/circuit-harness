name: Circuit harness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y csh iverilog ngspice
      - run: python -m pip install -e '.[dev,chips,harbor]'
      - run: ruff check circuit_harness tests && ruff format --check circuit_harness tests
      - run: python -m pytest -q --junitxml=runs/chips/validation/ci/junit.xml
      - run: python -m circuit_harness._schema_export
      - run: python -m compileall -q circuit_harness tests
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python tests/wheel_smoke.py dist/circuit_harness-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chips-local-tests
          path: runs/chips/validation/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
  trajectory-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,harbor,sft]' 'transformers==4.57.6'
      - run: python -m pytest -q tests/test_atif_dataset.py
        env:
          HF_HUB_OFFLINE: '1'
