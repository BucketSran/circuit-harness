# General Workflow composition root. Task-specific datasets, scoring inputs,
# model profiles, and output directories belong in examples or downstream configs.
defaults:
  - preset@workflow: vanilla_reasoning
  - dataset: default
  - runtime@runtimes.solver: alphaapollo
  - runtime@runtimes.verifier_runtime: alphaapollo_verifier
  - verifier@verifiers.verifier: agent
  - environment: default
  - _self_

version: 1

# One run executes each public input once. Leaves only override these values
# when they need repeated samples, a subset, or concurrent execution.
execution:
  samples: 1
  seed: 0
  limit: null
  concurrency: 1
  resume: true

# Omit or leave null for byte-for-byte memory-off behavior. Runnable recipes
# opt in with `memory: {mode: working, top_k: 3}`.
memory: null

# Gold is optional and remains outside the model-facing WorkflowInput. Runnable
# benchmark configs may select a private prepared-data build for post-run grading.
scoring: null

# Every runnable leaf must select its own output directory.
output:
  directory: ???
  format: jsonl
