# AlphaApollo on-policy HF-rollout overlay for custom architectures.
#
# Purpose: single-turn GRPO (no env block) through verl's HF-generate rollout
# (`rollout.name='hf'`), driven by AAHFRolloutWorker via main_on_policy_hf.
# Targets custom/small architectures (e.g. the CausalMLP conv LM exported by the
# pretrain checkpoint bridge) that vLLM cannot load.
#
# V-gate rule: AlphaApollo custom fields MUST live under alphaapollo.* or env.* ONLY.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - alphaapollo_on_policy
  - _self_

actor_rollout_ref:
  model:
    # Feed the model padded [bs, seq] batches — verl's nested/jagged
    # remove-padding path is incompatible with non-transformer architectures.
    use_remove_padding: false
  rollout:
    # verl HF-generate rollout instead of vLLM.
    name: hf
    # GRPO group size (no environment manager on this path).
    n: 8
    # verl struct-validates that one of log_prob_micro_batch_size[_per_gpu] is set;
    # the base leaves both unset.
    log_prob_micro_batch_size_per_gpu: 4
    # Read by AAHFRolloutWorker's HFServerActor only when rollout.name=hf;
    # harmless declarations otherwise. Sub-keys ARE struct-validated by
    # OmegaConf — declare new knobs here, or override with `+`.
    engine_kwargs:
      max_batch_size: 16      # requests merged into one model.generate() call
      max_wait_ms: 5.0        # wait window to fill a batch, in milliseconds
      device_map: null        # null=single .cuda(); "auto"/"0,1"=HF model parallel
      weight_push_chunk_bytes: 1073741824  # update_weights chunk size (peak-mem bound)
