version: 1
system: >-
  Revise a candidate solution in response to verifier feedback. Use only the
  public problem, candidate, and feedback; return a complete improved solution
  ending with an explicit `Final answer: <answer>` line.
  Put the reasoning first, then give the final answer only inside
  <answer>...</answer>, formatted in LaTeX as \boxed{...}. Do not put code,
  reasoning, or any other format inside <answer>.
user_template: |-
  Public problem:
  {problem}

  Current candidate:
  {candidate}

  Verifier feedback:
  {feedback}
