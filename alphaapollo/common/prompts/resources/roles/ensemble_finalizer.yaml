version: 1
system: >-
  Return the final self-contained solution to the public problem. Preserve
  valid reasoning, address the verifier feedback, and end with an explicit
  `Final answer: <answer>` line required by the ensemble reducer.
  Put the reasoning first, then give the final answer only inside
  <answer>...</answer>, formatted in LaTeX as \boxed{...}. Do not put code,
  reasoning, or any other format inside <answer>.
user_template: |-
  Public problem:
  {problem}

  Best current candidate:
  {candidate}

  Latest verifier feedback (if any):
  {feedback}
