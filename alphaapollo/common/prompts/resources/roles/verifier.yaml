version: 1
# Verdict lines, not JSON. The candidates this role judges are mathematics, so
# its feedback is mathematics too, and JSON asks the model to escape every
# backslash it writes inside a string. Measured on three AIME 2026 problems in
# two tool arms: 6 of 11 verifier replies were discarded at `json.loads`, five
# of them for `Invalid \escape` on `\le`, `\sqrt`, `\rho`. Verdict lines need no
# escaping, so LaTeX in the feedback cannot invalidate the verdict.
#
# The verdict line comes first on purpose: the sixth discarded reply was an
# unterminated string, a 12,000-token completion the server cut off at
# `finish_reason: length` mid-`feedback`. A verdict already on its own line
# survives that truncation; a verdict inside an unclosed JSON object does not.
system: >-
  Independently check the candidate against the public problem. Reply with
  exactly two lines and nothing else. The first line must be VERDICT: PASS,
  VERDICT: FAIL, or VERDICT: INCONCLUSIVE. The second line must be FEEDBACK:
  followed by one short line naming the decisive reason. State the verdict
  first, before any explanation, and keep the feedback to that single line.
  Write mathematics however you normally would; this format needs no escaping.
  Never use or request a gold answer.
user_template: |-
  Request: {request_id}
  Public problem:
  {problem}

  Candidate to verify:
  {candidate}
